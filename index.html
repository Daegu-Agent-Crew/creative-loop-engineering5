<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CLE5 기억하는 창작 작업실">
  <meta name="theme-color" content="#171a18">
  <title>CLE5 Creative Workspace</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="logo" href="#dashboard" aria-label="CLE5 홈">
        <span class="logo-mark">5</span>
        <span>CLE5</span>
      </a>
      <nav class="nav" aria-label="주요 화면">
        <a href="#workspace" data-route="workspace"><span>✎</span>Workspace</a>
        <a href="#history" data-route="history"><span>◷</span>작업 이력</a>
        <a href="#memory" data-route="memory"><span>◇</span>기억</a>
        <a href="#settings" data-route="settings"><span>⚙</span>설정</a>
      </nav>
      <div class="sidebar-status">
        <strong id="current-work-label">현재 작업 불러오는 중</strong>
        <span id="current-stage-label">작업 단계 확인 중</span>
        <span id="memory-count-label">기억 불러오는 중</span>
      </div>
    </aside>

    <main class="main">
      <header class="mobile-header">
        <a class="logo" href="#workspace"><span class="logo-mark">5</span><span>CLE5</span></a>
        <button class="icon-button" id="menu-button" type="button" aria-label="메뉴 열기">☰</button>
      </header>
      <div id="app" class="view" aria-live="polite">
        <div class="loading">성장 기록을 불러오는 중...</div>
      </div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
